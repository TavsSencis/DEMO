
[package]
name = "new_genesis"
version = "0.1.0"
edition = "2024"
default-run = "new_genesis"

[dependencies]
anyhow = "1.0"
libc = "0.2.174"
openssl = "0.10.73"
openssl-sys = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
zeroize = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A panic in a connection thread is a bug: stop the whole process instead of running on
# with a silently dead feed.
panic = "abort"
# Line tables only: symbolized perf/flamegraph profiles without slowing the build much.
debug = "line-tables-only"

[[bin]]
name = "new_genesis"
path = "src/main.rs"
